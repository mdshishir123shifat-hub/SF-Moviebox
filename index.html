<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white">
    <header class="p-4 flex justify-between items-center border-b border-zinc-800">
        <h1 class="text-xl font-bold text-red-600">StreamApp</h1>
        <input type="text" placeholder="Search movies..." class="bg-zinc-900 px-3 py-1.5 rounded text-sm outline-none border border-zinc-700">
    </header>
    
    <main class="p-4">
        <h2 class="text-lg font-semibold mb-3">Trending Now</h2>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <!-- Movie Card Example -->
            <div class="bg-zinc-900 rounded overflow-hidden border border-zinc-800">
                <div class="h-40 bg-zinc-800 flex items-center justify-center text-zinc-500">Poster</div>
                <div class="p-3">
                    <h3 class="font-medium text-sm">Sample Movie</h3>
                    <p class="text-xs text-zinc-400 mt-1">Action • 2026</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
